# Voting Application Pod Configuration
# This pod runs the main voting application where users cast their votes
# Provides a web interface for users to vote between different options
apiVersion: v1
kind: Pod
metadata:
  name: vote
  labels:
    app: vote
spec:
  containers:
    - name: vote
      # Docker sample voting app vote service - handles user voting interface
      image: dockersamples/examplevotingapp_vote
      ports:
        # HTTP port for serving the voting web interface
        - containerPort: 80
          name: vote
