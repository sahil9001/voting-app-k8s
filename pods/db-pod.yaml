# PostgreSQL Database Pod Configuration
# This pod runs a PostgreSQL database instance that stores voting data
# Uses the official PostgreSQL 15 Alpine image for lightweight deployment
apiVersion: v1
kind: Pod
metadata:
  name: db
  labels:
    app: db
spec:
  containers:
    - name: postgres
      # Official PostgreSQL 15 image with Alpine Linux for smaller footprint
      image: postgres:15-alpine
      env:
        # Database credentials - in production, use secrets instead of plain text
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
      ports:
        # Standard PostgreSQL port for database connections
        - containerPort: 5432
          name: postgres
