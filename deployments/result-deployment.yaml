# Result Application Deployment Configuration
# This deployment manages the result display application that shows voting statistics
# Displays real-time voting results in a web interface
# Uses Deployment instead of Pod for better reliability and scalability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app: result
spec:
  # Number of result app replicas - set to 1 for this demo
  # In production, you might want multiple replicas for load balancing
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      name: result
      labels:
        app: result
    spec:
      containers:
        - name: result
          # Docker sample voting app result service - displays voting results
          image: dockersamples/examplevotingapp_result
          ports:
            # HTTP port for serving the result web interface
            - containerPort: 80
              name: result
